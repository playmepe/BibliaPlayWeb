<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz OBS Studio Optimizada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #e6e6e6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #ff5e5e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: #555;
        }

        .btn-primary {
            background-color: #ff5e5e;
        }

        .btn-primary:hover {
            background-color: #ff7a7a;
        }

        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .panel-row {
            display: flex;
            width: 100%;
        }

        .panel {
            overflow: hidden;
            background-color: #252525;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
        }

        .panel-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .iframe-content {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
            overflow: hidden;
        }

        .divider {
            background-color: #333;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .divider-h {
            width: 100%;
            height: 10px;
            cursor: row-resize;
        }

        .divider-v {
            width: 10px;
            height: 100%;
            cursor: col-resize;
        }

        .divider-handle {
            position: absolute;
            background-color: #555;
            border-radius: 3px;
        }

        .divider-h .divider-handle {
            width: 30px;
            height: 5px;
            top: 2.5px;
            left: calc(50% - 20px);
        }

        .divider-v .divider-handle {
            width: 5px;
            height: 30px;
            left: 2.5px;
            top: calc(50% - 20px);
        }

        .divider.dragging {
            background-color: #ff5e5e;
        }

        .divider.dragging .divider-handle {
            background-color: #fff;
        }

        .top-panels {
            height: 200.648px;
        }

        .bottom-panels {
            height: 80%;
        }

        /* Panel de control de persistencia */
        .persistence-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(45, 45, 45, 0.9);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            z-index: 1000;
        }

        .persistence-controls button {
            margin: 2px;
            padding: 5px 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .persistence-controls button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Panel de control de persistencia -->
    <div class="persistence-controls" hidden>
        <button onclick="panelResizer.saveCurrentLayout()">💾 Guardar Layout</button>
        <button onclick="panelResizer.resetToDefault()">🔄 Resetear</button>
        <button onclick="panelResizer.clearSavedLayout()">🗑️ Limpiar</button>
    </div>

    <div class="container">
        <div class="panel-container">
            <!-- Paneles pequeños en la parte superior -->
            <div class="panel-row top-panels">
                <div class="panel" style="width: 53.5035%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../ctl_audio.html" id="audio-panel" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="divider divider-v" id="divider-3">
                    <div class="divider-handle"></div>
                </div>

                <div class="panel" style="width: 13.5063%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../pantalla_secundaria.html" id="transitions-panel" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="divider divider-v" id="divider-4">
                    <div class="divider-handle"></div>
                </div>

                <div class="panel" style="width: 10.0104%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../tempo_pantalla.html" id="chat-panel" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="divider divider-v" id="divider-5">
                    <div class="divider-handle"></div>
                </div>

                <div class="panel" style="width: 21.6702%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../tempo_main1.html" id="stats-panel" loading="lazy"></iframe>
                    </div>
                </div>
            </div>

            <div class="divider divider-h" id="divider-2">
                <div class="divider-handle"></div>
            </div>

            <!-- Paneles grandes en la parte inferior -->
            <div class="panel-row bottom-panels">
                <div class="panel" style="width: 22%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../control_lista.html" id="preview-panel-1" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="divider divider-v" id="divider-1">
                    <div class="divider-handle"></div>
                </div>

                <div class="panel" style="width: 57.06%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../tabpanel8.html" id="preview-panel-2" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="divider divider-v" id="divider-6">
                    <div class="divider-handle"></div>
                </div>

                <div class="panel" style="20.6474%;">
                    <div class="panel-content">
                        <iframe class="iframe-content" src="../indexBibliaM.html" id="sources-panel" loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sistema mejorado de redimensionamiento y persistencia
        class PanelResizer {
            constructor() {
                this.activeDivider = null;
                this.startX = 0;
                this.startY = 0;
                this.startSizes = {};
                this.STORAGE_KEY = 'obs-panel-layout';
                this.DEBOUNCE_DELAY = 500;
                this.defaultLayout = {
                    rows: {
                        'top-panels': '190.698px',
                        'bottom-panels': '867.028px'
                    },
                    panels: {
                        'audio-panel': '53.5035%',
                        'transitions-panel': '13.5063%',
                        'chat-panel': '10.0104%',
                        'stats-panel': '21.6702%',
                        'preview-panel-1': '22%',
                        'preview-panel-2': '57.06%',
                        'sources-panel': '20.6474%'
                    }
                };

                this.init();
            }

            init() {
                console.log('🔧 Inicializando PanelResizer...');
                this.setupDividers();
                this.loadPanelSizes();
                this.setupPerformanceOptimizations();
                //this.setupAutoSave();

                // Guardar layout inicial si no existe
                if (!localStorage.getItem(this.STORAGE_KEY)) {
                    this.saveCurrentLayout();
                    console.log('💾 Layout inicial guardado');
                }

                window.addEventListener('beforeunload', () => {
                    this.saveCurrentLayout();
                });

                console.log('✅ PanelResizer inicializado correctamente');
            }

            // Cargar tamaños guardados
            loadPanelSizes() {
                try {
                    const savedLayout = localStorage.getItem(this.STORAGE_KEY);
                    if (savedLayout) {
                        const layout = JSON.parse(savedLayout);
                        console.log('📥 Cargando layout guardado:', layout);

                        // Aplicar tamaños a las filas
                        if (layout.rows) {
                            Object.keys(layout.rows).forEach(rowClass => {
                                const row = document.querySelector(`.${rowClass}`);
                                if (row) {
                                    row.style.height = layout.rows[rowClass];
                                    console.log(`📏 Fila ${rowClass}: ${layout.rows[rowClass]}`);
                                }
                            });
                        }

                        // Aplicar tamaños a los paneles
                        if (layout.panels) {
                            Object.keys(layout.panels).forEach(panelId => {
                                const panel = this.findPanelByIframeId(panelId);
                                if (panel) {
                                    panel.style.width = layout.panels[panelId];
                                    console.log(`📏 Panel ${panelId}: ${layout.panels[panelId]}`);
                                }
                            });
                        }
                    } else {
                        console.log('ℹ️ No hay layout guardado, usando valores por defecto');
                        this.applyLayout(this.defaultLayout);
                    }
                } catch (error) {
                    console.error('❌ Error al cargar layout:', error);
                    this.applyLayout(this.defaultLayout);
                }
            }

            // Encontrar panel por ID del iframe
            findPanelByIframeId(iframeId) {
                const iframe = document.getElementById(iframeId);
                return iframe ? iframe.closest('.panel') : null;
            }

            // Aplicar un layout específico
            applyLayout(layout) {
                if (layout.rows) {
                    Object.keys(layout.rows).forEach(rowClass => {
                        const row = document.querySelector(`.${rowClass}`);
                        if (row) row.style.height = layout.rows[rowClass];
                    });
                }

                if (layout.panels) {
                    Object.keys(layout.panels).forEach(panelId => {
                        const panel = this.findPanelByIframeId(panelId);
                        if (panel) panel.style.width = layout.panels[panelId];
                    });
                }
            }

            // Guardar layout actual
            saveCurrentLayout = this.debounce(() => {
                try {
                    const layout = {
                        rows: {},
                        panels: {},
                        timestamp: new Date().toISOString()
                    };

                    // Guardar tamaños de filas
                    const topRow = document.querySelector('.top-panels');
                    const bottomRow = document.querySelector('.bottom-panels');

                    if (topRow) layout.rows['top-panels'] = topRow.style.height || getComputedStyle(topRow).height;
                    if (bottomRow) layout.rows['bottom-panels'] = bottomRow.style.height || getComputedStyle(bottomRow).height;

                    // Guardar tamaños de paneles
                    const panelElements = document.querySelectorAll('.panel');
                    panelElements.forEach(panel => {
                        const iframe = panel.querySelector('iframe');
                        if (iframe && iframe.id) {
                            layout.panels[iframe.id] = panel.style.width || getComputedStyle(panel).width;
                        }
                    });

                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(layout));
                    console.log('💾 Layout guardado:', layout);

                    // Mostrar notificación visual
                    this.showSaveNotification();

                } catch (error) {
                    console.error('❌ Error al guardar layout:', error);
                }
            }, this.DEBOUNCE_DELAY);

            /////////////////////////////////////////////////////////// Configurar auto-guardado periódico
/*            setupAutoSave() {
                // Guardar cada 30 segundos por si acaso
                setInterval(() => {
                    this.saveCurrentLayout();
                }, 30000);
            }
*/
            // Mostrar notificación de guardado
            showSaveNotification() {
                const notification = document.createElement('div');
                notification.textContent = '💾 Layout guardado';
                notification.style.cssText = `
                    position: fixed;
                    top: 50px;
                    right: 10px;
                    background: #4CAF50;
                    color: white;
                    padding: 10px;
                    border-radius: 5px;
                    z-index: 1001;
                    font-size: 12px;
                `;
                document.body.appendChild(notification);

                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            }

            // Resetear a valores por defecto
            resetToDefault() {
                if (confirm('¿Restablecer el layout a los valores por defecto?')) {
                    this.applyLayout(this.defaultLayout);
                    this.saveCurrentLayout();
                    console.log('🔄 Layout restablecido a valores por defecto');
                }
            }

            // Limpiar layout guardado
            clearSavedLayout() {
                if (confirm('¿Eliminar el layout guardado?')) {
                    localStorage.removeItem(this.STORAGE_KEY);
                    console.log('🗑️ Layout guardado eliminado');
                    location.reload(); // Recargar para aplicar valores por defecto
                }
            }

            setupDividers() {
                const dividers = document.querySelectorAll('.divider');

                dividers.forEach(divider => {
                    divider.addEventListener('mousedown', (e) => this.startDrag(e));
                });

                document.addEventListener('mouseup', () => this.stopDrag());
                document.addEventListener('mousemove', (e) => this.handleDrag(e));
            }

            startDrag(e) {
                this.activeDivider = e.target.closest('.divider');
                if (!this.activeDivider) return;

                this.activeDivider.classList.add('dragging');
                this.startX = e.clientX;
                this.startY = e.clientY;

                // Configurar cursor y prevenir selección de texto
                document.body.style.cursor = this.activeDivider.classList.contains('divider-v') ? 'col-resize' : 'row-resize';
                document.body.style.userSelect = 'none';

                // Guardar tamaños iniciales
                if (this.activeDivider.classList.contains('divider-v')) {
                    const prevPanel = this.activeDivider.previousElementSibling;
                    const nextPanel = this.activeDivider.nextElementSibling;

                    if (prevPanel && nextPanel) {
                        this.startSizes.prevWidth = this.parseSize(getComputedStyle(prevPanel).width);
                        this.startSizes.nextWidth = this.parseSize(getComputedStyle(nextPanel).width);
                        this.startSizes.containerWidth = this.activeDivider.parentElement.offsetWidth;
                    }
                } else {
                    const prevRow = this.activeDivider.previousElementSibling;
                    const nextRow = this.activeDivider.nextElementSibling;

                    if (prevRow && nextRow) {
                        this.startSizes.prevHeight = this.parseSize(getComputedStyle(prevRow).height);
                        this.startSizes.nextHeight = this.parseSize(getComputedStyle(nextRow).height);
                        this.startSizes.containerHeight = this.activeDivider.parentElement.offsetHeight;
                    }
                }

                e.preventDefault();
            }

            handleDrag(e) {
                if (!this.activeDivider) return;

                if (this.activeDivider.classList.contains('divider-v')) {
                    this.handleVerticalDrag(e);
                } else {
                    this.handleHorizontalDrag(e);
                }
            }

            handleVerticalDrag(e) {
                const deltaX = e.clientX - this.startX;
                const prevPanel = this.activeDivider.previousElementSibling;
                const nextPanel = this.activeDivider.nextElementSibling;

                if (!prevPanel || !nextPanel) return;

                // Calcular nuevos porcentajes
                const prevNewPercent = ((this.startSizes.prevWidth + deltaX) / this.startSizes.containerWidth) * 100;
                const nextNewPercent = ((this.startSizes.nextWidth - deltaX) / this.startSizes.containerWidth) * 100;

                // Aplicar límites (mínimo 10%, máximo 90%)
                if (prevNewPercent >= 10 && nextNewPercent >= 10) {
                    prevPanel.style.width = `${prevNewPercent}%`;
                    nextPanel.style.width = `${nextNewPercent}%`;

                    // Guardar después del redimensionamiento
                    this.saveCurrentLayout();
                }
            }

            handleHorizontalDrag(e) {
                const deltaY = e.clientY - this.startY;
                const prevRow = this.activeDivider.previousElementSibling;
                const nextRow = this.activeDivider.nextElementSibling;

                if (!prevRow || !nextRow) return;

                // Calcular nuevas alturas en píxeles
                const prevNewHeight = this.startSizes.prevHeight + deltaY;
                const nextNewHeight = this.startSizes.nextHeight - deltaY;

                // Aplicar límites (mínimo 50px)
                if (prevNewHeight >= 50 && nextNewHeight >= 50) {
                    prevRow.style.height = `${prevNewHeight}px`;
                    nextRow.style.height = `${nextNewHeight}px`;

                    // Guardar después del redimensionamiento
                    this.saveCurrentLayout();
                }
            }

            stopDrag() {
                if (this.activeDivider) {
                    this.activeDivider.classList.remove('dragging');
                    this.activeDivider = null;

                    // Restaurar cursor y selección de texto
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';

                    this.startSizes = {};
                }
            }

            parseSize(size) {
                return parseFloat(size) || 0;
            }

            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            setupPerformanceOptimizations() {
                // Optimización: Suspender iframes no visibles
                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            const iframe = entry.target;
                            iframe.style.pointerEvents = entry.isIntersecting ? 'auto' : 'none';
                        });
                    }, { threshold: 0.1 });

                    document.querySelectorAll('iframe').forEach(iframe => {
                        observer.observe(iframe);
                    });
                }
            }
        }

        // Inicializar cuando el DOM esté listo
        let panelResizer;
        document.addEventListener('DOMContentLoaded', () => {
            panelResizer = new PanelResizer();
        });
    </script>
</body>
</html>
