    /* Estilos para el modal de configuración */
        .config-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .config-modal-content {
            background-color: #5a7d55;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;

            overflow-y: auto;
        }

        .config-close {

            float: right;
            font-size: 28px;

            cursor: pointer;
        }

        .config-close:hover {

        }

        }

        .config-group {

        }

            width: 120px;
            font-weight: bold;
        }

        }

            margin-left: 10px;
            vertical-align: middle;
        }

        }

        .config-buttons button {

            margin: 0 5px;

<script>
       function validateInput(input) {
            // Reemplaza caracteres no permitidos
            let value = input.value.replace(/[^0-9-]/g, '');

            // Asegúrate de que el guion no esté al inicio
            if (value.startsWith('-')) {
                value = value.substring(1);
            }

            // Asegúrate de que solo haya un guion y que esté entre números
            const parts = value.split('-');
            if (parts.length > 2) {
                value = parts[0] + '-' + parts[1];
            }

            input.value = value;
        }
        document.getElementById('header').addEventListener('dblclick', function() {
            location.reload(); // Recargar la página
        });
    </script>
